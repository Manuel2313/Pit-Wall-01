
  <header class="site-header">
    <nav class="site-header__nav">
      <a routerLink="/" class="site-header__brand">Pit Wall</a>

      @if (auth.isAuthenticated()) {
        <div class="site-header__user">
          <span class="site-header__greeting">
            <span class="site-header__greeting-label">Piloto</span>
            <span class="site-header__greeting-email">{{ auth.userEmail() }}</span>
          </span>
          <button
            (click)="logoutRequested.emit()"
            class="btn btn-sm btn-outline-light">
            Logout
          </button>
        </div>
      } @else {
        <button
          (click)="loginRequested.emit()"
          class="btn btn-sm btn-primary">
          Login
        </button>
      }
    </nav>
  </header>
